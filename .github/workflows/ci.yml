name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  install-lint-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@11.24.0

      - name: Verify canonical setup preflight
        run: node scripts/setup.mjs --check

      - name: Test setup failure paths
        run: node --test scripts/setup-tests.mjs

      - name: 驗證公開政策頁隔離及拒絕覆寫
        run: node --test scripts/calendar-site-tests.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 驗證正式建置拒絕示範設定
        run: pnpm test:live-build

      - name: Lint the code
        run: pnpm lint

      # - name: Analyze unused files and dependencies
      #   run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests
        run: pnpm test

      - name: Build the project
        run: pnpm build
